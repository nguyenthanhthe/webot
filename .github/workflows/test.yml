name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Syntax Check (Python)
      run: |
        python -m compileall -q wvbot tools run.py setcreds.py

    - name: Syntax Check (Shell)
      run: |
        for f in tools/*.sh; do sh -n "$f"; done

    - name: Syntax Check (Node)
      run: |
        if command -v node >/dev/null 2>&1; then
          for f in web/*.mjs web/*.js tools/*.mjs; do node --check "$f"; done
        fi

    - name: Verify Package Manifest
      run: |
        python tools/package.py --check

    - name: Run Test Suite
      run: |
        python -B -m unittest discover -s tests -v
